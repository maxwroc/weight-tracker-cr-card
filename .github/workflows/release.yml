name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Build & attach card to release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Validate release tag is semver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "const v=process.env.VERSION;const re=/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-.]+)?(?:\+[0-9A-Za-z-.]+)?$/;if(!re.test(v)){console.error('Invalid tag '+process.env.GITHUB_REF_NAME+'. Expected semver like 1.2.3 or v1.2.3.');process.exit(1);}"
          echo "Release version: $VERSION"
        env:
          VERSION: ${{ github.ref_name }}

      - name: Bump versions from release tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "const fs=require('fs');const p='package.json';const j=JSON.parse(fs.readFileSync(p));j.version=process.env.VERSION;fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');"
          sed -i "s/^export const CARD_VERSION = '.*';$/export const CARD_VERSION = '$VERSION';/" src/const.ts
        env:
          VERSION: ${{ github.ref_name }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload card to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/weight-tracker-cr-card.js
          asset_name: weight-tracker-cr-card.js
          tag: ${{ github.ref }}
          overwrite: true

  hacs:
    name: HACS validation
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # HACS resolves a plugin's JS file from the latest GitHub release, so
      # validation only makes sense once the release asset above has been
      # uploaded. Running this as a dependent job (rather than a separate
      # workflow) guarantees the ordering.
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: plugin

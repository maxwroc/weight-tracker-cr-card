<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Weight Tracker CR Card — demo</title>
    <style>
      body {
        font-family: Roboto, system-ui, sans-serif;
        background: #f4f5f7;
        margin: 0;
        padding: 24px;
        /* Emulate a few HA theme variables so the card is themed. */
        --primary-color: #03a9f4;
        --primary-text-color: #212121;
        --secondary-text-color: #727272;
        --divider-color: #e0e0e0;
        --card-background-color: #ffffff;
        --secondary-background-color: #f0f0f0;
        --error-color: #db4437;
        --text-primary-color: #ffffff;
        --ha-card-border-radius: 12px;
      }
      .wrap {
        max-width: 420px;
        margin: 0 auto;
      }
      /* Minimal ha-card stand-in so the demo looks card-like without HA. */
      ha-card {
        display: block;
        background: var(--card-background-color);
        border-radius: var(--ha-card-border-radius);
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <weight-tracker-cr-card id="card"></weight-tracker-cr-card>
    </div>

    <script type="module">
      import '../dist/weight-tracker-cr-card.js';

      // --- Build a year of synthetic weight data (descending 104.6 -> ~93). ---
      const now = Date.now();
      const DAY = 86_400_000;
      const records = [];
      for (let i = 365; i >= 0; i -= 3) {
        const t = now - i * DAY;
        const progress = (365 - i) / 365;
        const weight = 104.6 - progress * 11 + (Math.random() - 0.5) * 0.6;
        records.push({
          id: 365 - i,
          timestamp: new Date(t).toISOString(),
          weight: +weight.toFixed(1),
        });
      }

      const inRange = (start, end) =>
        records.filter((r) => {
          const t = Date.parse(r.timestamp);
          return t >= Date.parse(start) && t <= Date.parse(end);
        });

      function aggregate(start, end, bucketMs) {
        const rows = inRange(start, end);
        const buckets = new Map();
        for (const r of rows) {
          const t = Date.parse(r.timestamp);
          const key = Math.floor(t / bucketMs) * bucketMs;
          const b = buckets.get(key) || { sum: 0, n: 0 };
          b.sum += r.weight;
          b.n += 1;
          buckets.set(key, b);
        }
        return [...buckets.entries()]
          .sort((a, b) => a[0] - b[0])
          .map(([x, b]) => ({ x, y: +(b.sum / b.n).toFixed(2) }));
      }

      const connection = {
        async sendMessagePromise(msg) {
          switch (msg.type) {
            case 'custom_records/list_record_types':
              return {
                record_types: [
                  {
                    key: 'body_weight',
                    name: 'Body Weight',
                    fields: [{ key: 'weight', name: 'Weight', type: 'number', required: true }],
                  },
                ],
              };
            case 'custom_records/list_records':
              return inRange(msg.start, msg.end);
            case 'custom_records/aggregate_records': {
              const bucketMs = msg.bucket === 'week' ? 7 * DAY : DAY;
              return { series: [{ name: 'weight', data: aggregate(msg.start, msg.end, bucketMs) }] };
            }
            case 'custom_records/add_record':
              records.push({
                id: records.length + 1,
                timestamp: new Date().toISOString(),
                ...msg.fields,
              });
              window.dispatchEvent(new Event('cr-updated'));
              return {};
            default:
              return {};
          }
        },
        async subscribeEvents(cb) {
          const handler = () => cb({});
          window.addEventListener('cr-updated', handler);
          return () => window.removeEventListener('cr-updated', handler);
        },
      };

      const card = document.getElementById('card');
      card.setConfig({
        type: 'custom:weight-tracker-cr-card',
        title: 'Weight Tracker',
        record_type: 'body_weight',
        value_field: 'weight',
        target: 86,
        start_weight: 104.6,
        unit: 'kg',
        default_period: '1y',
      });
      card.hass = { connection };
    </script>
  </body>
</html>
